name: Deploy GCP Cloud Function

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Function
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          gcloud functions deploy job-scraper \
            --gen2 \
            --runtime=python312 \
            --region=us-central1 \
            --source=functions/scraper \
            --entry-point=scraper \
            --trigger-http \
            --timeout=540s \
            --memory=512MB \
            --project=job-scraper-pipeline-496721 \
            --set-env-vars="^|^AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}|AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}|AWS_DEFAULT_REGION=us-east-1|S3_BUCKET=job-scraper-pipeline-juan|LOG_EXECUTION_ID=true"
